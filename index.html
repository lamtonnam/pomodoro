<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; background-color: #1f1f1f; color: #ffffff;
        }
        .timer { font-size: 52px; font-weight: bold; font-family: monospace; margin: 15px 0; color: #2eaadc; }
        .status { font-size: 16px; color: #aaaaaa; }
        button {
            background-color: #2eaadc; color: white; border: none; padding: 8px 18px;
            border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #008cc1; }
    </style>
</head>
<body>
    <div class="status" id="status">ช่วงโฟกัสงาน</div>
    <div class="timer" id="timer">25:00</div>
    <button onclick="toggleTimer()" id="btn">เริ่มจับเวลา</button>

    <script>
        let timeLeft = 25 * 60;
        let isRunning = false;
        let timerId = null;

        function updateDisplay() {
            let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                document.getElementById('btn').innerText = "เริ่มต่อ";
            } else {
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        alert("หมดเวลาโฟกัสแล้ว!");
                    }
                }, 1000);
                document.getElementById('btn').innerText = "หยุดชั่วคราว";
            }
            isRunning = !isRunning;
        }
        updateDisplay();
    </script>
</body>
</html>
