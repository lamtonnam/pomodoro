<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Pomodoro Timer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; background-color: #1f1f1f; color: #ffffff;
        }
        .card {
            background: #2b2b2b; padding: 20px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; width: 280px;
        }
        .status { font-size: 16px; color: #aaaaaa; font-weight: 500; }
        .timer { font-size: 56px; font-weight: bold; font-family: monospace; color: #2eaadc; margin: 5px 0; }
        .session-info { font-size: 14px; color: #888; margin-bottom: 12px; }
        
        .progress-container { width: 100%; background-color: #444; border-radius: 10px; height: 8px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background-color: #2eaadc; transition: width 0.3s ease; }

        .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
        button {
            background-color: #2eaadc; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; flex: 1;
        }
        button:hover { opacity: 0.9; }
        button.reset { background-color: #e05252; }
        
        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            font-size: 12px; color: #ccc; border-top: 1px solid #444; padding-top: 12px; text-align: left;
        }
        .settings-item { display: flex; flex-direction: column; gap: 4px; }
        .settings-item input {
            background: #333; border: 1px solid #555; color: white;
            text-align: center; border-radius: 4px; padding: 4px; font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="status" id="status">ช่วงโฟกัสงาน 💻</div>
    <div class="timer" id="timer">25:00</div>
    <div class="session-info" id="session-info">รอบโฟกัสที่ 1</div>

    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="controls">
        <button onclick="toggleTimer()" id="btn-start">เริ่ม</button>
        <button class="reset" onclick="resetTimer()">รีเซ็ต</button>
    </div>

    <div class="settings-grid">
        <div class="settings-item">
            <label for="work-time">เวลาโฟกัส (นาที):</label>
            <input type="number" id="work-time" value="25" min="1" max="120" onchange="applyCustomTimes()">
        </div>
        <div class="settings-item">
            <label for="break-time">เวลาพัก (นาที):</label>
            <input type="number" id="break-time" value="5" min="1" max="60" onchange="applyCustomTimes()">
        </div>
    </div>
</div>

<script>
    let workMinutes = 25;
    let breakMinutes = 5;

    let timerId = null;
    let isRunning = false;
    let isBreak = false;
    let focusCount = 1;
    let endTime = null;
    let totalDuration = workMinutes * 60;

    function updateDisplay() {
        let now = Date.now();
        let remainingSeconds = isRunning ? Math.max(0, Math.ceil((endTime - now) / 1000)) : totalDuration;

        let mins = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
        let secs = (remainingSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
        
        let percentage = ((totalDuration - remainingSeconds) / totalDuration) * 100;
        document.getElementById('progress').style.width = `${percentage}%`;

        document.getElementById('session-info').innerText = !isBreak 
            ? `รอบโฟกัสที่ ${focusCount}` 
            : `ช่วงพักหลังรอบที่ ${focusCount}`;

        return remainingSeconds;
    }

    function tick() {
        let remaining = updateDisplay();
        if (remaining <= 0 && isRunning) {
            clearInterval(timerId);
            playBeep();
            switchSession();
        }
    }

    function toggleTimer() {
        if (isRunning) {
            // หยุดชั่วคราว
            clearInterval(timerId);
            totalDuration = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
            isRunning = false;
            document.getElementById('btn-start').innerText = "ทำต่อ";
        } else {
            // เริ่มนับ
            endTime = Date.now() + (totalDuration * 1000);
            isRunning = true;
            timerId = setInterval(tick, 250); // เช็กถี่ขึ้นเพื่อความแม่นยำ
            document.getElementById('btn-start').innerText = "พัก";
        }
    }

    function switchSession() {
        isBreak = !isBreak;
        if (isBreak) {
            document.getElementById('status').innerText = "ช่วงพักผ่อน ☕";
            totalDuration = breakMinutes * 60;
        } else {
            focusCount++;
            document.getElementById('status').innerText = "ช่วงโฟกัสงาน 💻";
            totalDuration = workMinutes * 60;
        }

        isRunning = false;
        document.getElementById('btn-start').innerText = "เริ่ม";
        updateDisplay();
    }

    function applyCustomTimes() {
        if (isRunning) return;
        let workInput = parseInt(document.getElementById('work-time').value);
        let breakInput = parseInt(document.getElementById('break-time').value);

        if (workInput > 0) workMinutes = workInput;
        if (breakInput > 0) breakMinutes = breakInput;

        totalDuration = (isBreak ? breakMinutes : workMinutes) * 60;
        updateDisplay();
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        isBreak = false;
        focusCount = 1;
        applyCustomTimes();
        document.getElementById('status').innerText = "ช่วงโฟกัสงาน 💻";
        document.getElementById('btn-start').innerText = "เริ่ม";
        updateDisplay();
    }

    function playBeep() {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 800;
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    }

    // เมื่อสลับกลับเข้ามาที่หน้าแอป/Notion ให้คำนวณเวลาใหม่ทันที
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && isRunning) {
            tick();
        }
    });

    updateDisplay();
</script>

</body>
</html>
